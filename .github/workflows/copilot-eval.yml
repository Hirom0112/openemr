name: Clinical Co-Pilot — Eval Suite

on:
  push:
    paths:
      - "agent-api/**"
      - ".github/workflows/copilot-eval.yml"
  pull_request:
    paths:
      - "agent-api/**"
      - ".github/workflows/copilot-eval.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode for the W2 eval suite"
        type: choice
        required: false
        default: "full"
        options: [full, smoke, failing-only]

jobs:
  eval:
    name: Eval Suite
    runs-on: ubuntu-latest

    env:
      # Empty (not a placeholder string) so live_api tests gated on
      # `skipif(not os.environ.get("ANTHROPIC_API_KEY"))` actually skip —
      # a truthy placeholder produces a real 401 against Anthropic.
      ANTHROPIC_API_KEY: ""
      OPENEMR_BASE_URL: "http://localhost"
      FHIR_CLIENT_ID: ""
      FHIR_CLIENT_SECRET: ""
      REDIS_URL: "redis://localhost:6379/0"
      LANGFUSE_SECRET_KEY: "test"
      LANGFUSE_PUBLIC_KEY: "test"
      LANGFUSE_HOST: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-api/requirements.txt

      - name: Install dependencies
        run: pip install -r agent-api/requirements.txt pytest

      # Full suite — also enforces the unmarked-test guard via conftest hook.
      - name: Run full eval suite
        run: |
          python3 -m pytest agent-api/tests \
            --tb=short \
            --strict-markers \
            --strict-config \
            -q \
            --junitxml=eval-results.xml

      # hard_failure gate — verify non-empty via pytest exit code, then run.
      # Exit 0 = tests collected. Exit 5 = no tests collected (vacuous gate).
      # Any other non-zero = collection/config/infrastructure error.
      # The collection check here guarantees non-empty selection; the execution
      # step below relies on that guarantee (pytest exit 5 would still fail it,
      # but the distinct error message here is what surfaces the root cause).
      - name: Verify hard_failure marker is non-empty
        run: |
          python3 -m pytest agent-api/tests \
            -m hard_failure \
            --collect-only -q --no-header \
            --strict-markers --strict-config
          EXIT=$?
          case $EXIT in
            0) echo "hard_failure: non-empty marker selection confirmed" ;;
            5) echo "ERROR: hard_failure marker selects 0 tests — vacuous gate, fix test markers" >&2; exit 1 ;;
            *) echo "ERROR: pytest collection failed with exit $EXIT — see output above" >&2; exit $EXIT ;;
          esac

      - name: Run hard_failure gate (100% pass required)
        run: |
          python3 -m pytest agent-api/tests \
            -m hard_failure \
            --tb=short \
            --strict-markers \
            --strict-config \
            -q

      # clinical_accuracy gate — same exit-code pattern as hard_failure above.
      - name: Verify clinical_accuracy marker is non-empty
        run: |
          python3 -m pytest agent-api/tests \
            -m clinical_accuracy \
            --collect-only -q --no-header \
            --strict-markers --strict-config
          EXIT=$?
          case $EXIT in
            0) echo "clinical_accuracy: non-empty marker selection confirmed" ;;
            5) echo "ERROR: clinical_accuracy marker selects 0 tests — vacuous gate, fix test markers" >&2; exit 1 ;;
            *) echo "ERROR: pytest collection failed with exit $EXIT — see output above" >&2; exit $EXIT ;;
          esac

      - name: Run clinical_accuracy gate (95% accuracy gate)
        run: |
          python3 -m pytest agent-api/tests \
            -m clinical_accuracy \
            --tb=short \
            --strict-markers \
            --strict-config \
            -q

      # routing eval gate — subset of test_agent_routing.py; non-empty guard via exit code.
      - name: Routing eval gate
        run: |
          python3 -m pytest agent-api/tests/test_agent_routing.py \
            -m "clinical_accuracy or hard_failure" \
            --strict-markers --strict-config \
            -q --tb=short
          EXIT=$?
          if [ $EXIT -eq 5 ]; then
            echo "ERROR: No routing tests collected — empty selection guard" >&2
            exit 1
          fi
          exit $EXIT

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval-results.xml

  w2-eval:
    name: W2 Eval Suite
    runs-on: ubuntu-latest
    # This job calls Anthropic + Voyage + Cohere APIs on 124 cases; gated to PRs and manual
    # dispatch to control spend. W1 eval suite (no LLM calls) continues running on every push.
    # W2 runs independently. The W1 suite has unrelated pre-existing
    # failures (triage / verification / synthetic-patient fixtures) that
    # don't share state with W2 — gating W2 on W1 just hides the W2 gate.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write   # for sticky-pull-request-comment to post the eval table

    # MySQL 8 service container so the provenance_chain rubric can probe the
    # ``copilot_observations`` table instead of silently skipping (None →
    # excluded from the pass-rate denominator). The runner reads
    # ``COPILOT_OBSERVATIONS_MYSQL_URL`` to decide whether the probe runs.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: openemr
          MYSQL_USER: openemr
          MYSQL_PASSWORD: openemr
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=rootpw"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
      COPILOT_OBSERVATIONS_MYSQL_URL: "mysql://openemr:openemr@127.0.0.1:3306/openemr"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-api/requirements.txt
      - run: pip install -r agent-api/requirements.txt pytest aiomysql
      - name: Bootstrap copilot_observations schema
        # Minimal schema so probe_observations() can read empty result-sets
        # without errors. When real observations land (CI integration tests),
        # they populate this table via the OpenEMR write path; the eval
        # gate then asserts derivedFrom + citations end-to-end.
        # TODO(stage-4-followup): replace with the canonical OpenEMR migration
        # once the agent-api side is mounted alongside the PHP container.
        #
        # Phase 9 Slice 9.9 — adds copilot_pending_extractions and
        # copilot_quarantined_documents so the new mechanical rubrics
        # (no_unconfirmed_writes, quarantine_audit_emitted) can probe the
        # tables instead of silently skipping. Schemas are minimal — the
        # canonical migrations live in sql/copilot/* and replace these once
        # the agent-api side is mounted alongside the PHP container.
        run: |
          mysql --host=127.0.0.1 --user=openemr --password=openemr openemr <<'SQL'
          CREATE TABLE IF NOT EXISTS copilot_observations (
            id VARCHAR(64) NOT NULL PRIMARY KEY,
            fhir_resource JSON NOT NULL,
            citations JSON NOT NULL
          );
          CREATE TABLE IF NOT EXISTS copilot_pending_extractions (
            id VARCHAR(64) NOT NULL PRIMARY KEY,
            observation_id VARCHAR(64) NULL,
            state VARCHAR(32) NOT NULL,
            reason TEXT NULL,
            payload JSON NOT NULL,
            created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
          CREATE TABLE IF NOT EXISTS copilot_quarantined_documents (
            id VARCHAR(64) NOT NULL PRIMARY KEY,
            patient_hint VARCHAR(128) NULL,
            event VARCHAR(64) NOT NULL,
            detail_json JSON NOT NULL,
            created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
          SQL
      - name: Generate eval fixture corpus
        run: python3 agent-api/tests/fixtures/eval/_generate_eval_corpus.py
      - name: Generate W2 multimodal corpus (Phase 9 Slice 9.9)
        # 15 anchors checked into git + 20 derivatives generated on-demand
        # (HL7 wrong-patient/multi-patient, XLSX sparse/wrong-mrn/blank,
        # DOCX wrong-name/corrupt-xml, TIFF mode1/4-page/corrupt-IFD).
        run: python3 agent-api/tests/fixtures/w2/multimodal/_generate_w2_multimodal_corpus.py
      # Pull the most recent successful w2-eval artifact from the base branch
      # so we can re-run only previously-failing cases on this PR. Falls back
      # to full mode silently if no prior artifact exists.
      - name: Download prior eval artifact (best-effort)
        id: prior-artifact
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: copilot-eval.yml
          name: w2-eval-results
          branch: ${{ github.base_ref }}
          path: ./prior
          if_no_artifact_found: warn
          workflow_conclusion: success
      - name: Resolve eval run mode
        id: mode
        run: |
          dispatch_mode="${{ github.event.inputs.mode }}"
          have_prior="false"
          if [ -f "./prior/eval_results.json" ]; then
            have_prior="true"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="$dispatch_mode"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "$have_prior" = "true" ]; then
            mode="failing-only"
          else
            mode="full"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "have_prior=$have_prior" >> "$GITHUB_OUTPUT"
          echo "Resolved eval mode: $mode (have_prior=$have_prior)"
      - name: Run W2 eval suite
        run: |
          cd agent-api
          case "${{ steps.mode.outputs.mode }}" in
            smoke)
              python3 -m evals.run_full_suite --smoke --output ../eval_results.json
              ;;
            failing-only)
              python3 -m evals.run_full_suite \
                --failing-only ../prior/eval_results.json \
                --output ../eval_results.json
              ;;
            full|*)
              python3 -m evals.run_full_suite --output ../eval_results.json
              ;;
          esac
      - name: Diff against baseline
        run: |
          python3 agent-api/evals/diff_baseline.py \
            --baseline agent-api/evals/baseline.json \
            --results eval_results.json
      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w2-eval-results
          path: |
            eval_results.json
            eval_results.md
            repoint_trace.jsonl
      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: eval_results.md
