# Clinical Co-Pilot — overlay compose file (local development only).
#
# Production deployment uses Railway services — see scripts/deploy-railway.sh.
#
# Usage (from docker/development-easy/):
#   cp .env.copilot.example .env.copilot && vi .env.copilot   # fill in secrets
#   docker compose -f docker-compose.yml -f docker-compose.copilot.yml up -d
#
# Services added:
#   agent-api      — Python FastAPI agent service (port 8400)
#   redis          — conversation cache + checkpointer (port 6380 on host)
#   redis-exporter — Prometheus Redis metrics
#   prometheus     — metrics collector (port 9090)
#   grafana        — dashboards (port 3001)
#
# Langfuse: uses Langfuse Cloud (cloud.langfuse.com) — no self-hosted container.
# Set LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY in your .env.copilot file.

services:

  # ── Agent API ─────────────────────────────────────────────────────────────
  agent-api:
    build:
      context: ../../agent-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${COPILOT_API_PORT:-8400}:8400"
    volumes:
      - agent-sqlite:/data
    environment:
      OPENEMR_BASE_URL: "${OPENEMR_BASE_URL:-http://openemr}"
      FHIR_CLIENT_ID: "${FHIR_CLIENT_ID:-}"
      FHIR_CLIENT_SECRET: "${FHIR_CLIENT_SECRET:-}"
      FHIR_TOKEN_URL: "${FHIR_TOKEN_URL:-}"
      FHIR_USERNAME: "${FHIR_USERNAME:-admin}"
      FHIR_PASSWORD: "${FHIR_PASSWORD:-}"
      FHIR_USER_ROLE: "${FHIR_USER_ROLE:-users}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      REDIS_URL: "redis://redis:6379/0"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-https://cloud.langfuse.com}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8400/health"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 10s
      interval: 15s
      timeout: 3s
      retries: 3

  redis-exporter:
    image: oliver006/redis_exporter:v1.65.0-alpine
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../../agent-monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ../../agent-monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../agent-monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    depends_on:
      - prometheus

volumes:
  redisdata: {}
  agent-sqlite: {}
  prometheus-data: {}
  grafana-data: {}
