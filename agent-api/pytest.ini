[pytest]
testpaths = tests
pythonpath = .
addopts = -v --tb=short
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    hard_failure: tests that must all pass (100% gate; failure blocks deploy)
    clinical_accuracy: tests asserting clinician-meaningful correctness (95% accuracy gate)
    live_api: tests that hit a live external API (skipped automatically when credentials are absent)
