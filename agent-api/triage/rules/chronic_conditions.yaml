# Curated chronic-condition code list for the P9 "Active Condition — Stable"
# rule.  A patient's `active_condition` flag is set in criteria.py only when
# at least one of their active Condition resources matches an entry below.
#
# This prevents acute-only diagnoses (e.g. pneumonia, post-op day 1) from
# defaulting to P9 just because *some* Condition resource exists.
#
# Mixing SNOMED CT and ICD-10 is intentional — match on system+code together.
codes:
  - system: "http://snomed.info/sct"
    code: "38341003"
    label: "Essential hypertension"
  - system: "http://hl7.org/fhir/sid/icd-10"
    code: "I10"
    label: "Essential (primary) hypertension"
  - system: "http://snomed.info/sct"
    code: "44054006"
    label: "Type 2 diabetes mellitus"
  - system: "http://hl7.org/fhir/sid/icd-10"
    code: "E11.9"
    label: "Type 2 diabetes mellitus without complications"
  - system: "http://snomed.info/sct"
    code: "13645005"
    label: "Chronic obstructive pulmonary disease"
  - system: "http://hl7.org/fhir/sid/icd-10"
    code: "J44.9"
    label: "Chronic obstructive pulmonary disease, unspecified"
