openapi: 3.1.0
info:
  title: Clinical Co-Pilot API
  version: 0.1.0
paths:
  /metrics:
    get:
      summary: Metrics
      description: Endpoint that serves Prometheus metrics.
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /audit/destruction-record:
    post:
      summary: Post Destruction Record
      description: "Record (don't perform) a compliance-driven PHI destruction.\n\n\
        Auth required (enforced upstream by ``jwt_middleware``).  ``requested_by``\n\
        is taken from the verified JWT's ``sub`` \u2014 the body cannot override it."
      operationId: post_destruction_record_audit_destruction_record_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestructionRecordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestructionRecordResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /fhir/patient/{patient_id}:
    get:
      summary: Get Patient
      operationId: get_patient_fhir_patient__patient_id__get
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          title: Patient Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Patient Fhir Patient  Patient Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /diag/fhir:
    get:
      summary: Diag Fhir
      description: 'One-shot FHIR connectivity probe. Gated by COPILOT_DIAG env flag.


        Forces a fresh token, performs GET /Patient?identifier=1, and returns

        the resolved URL, status, body snippet, and token metadata. Never logs

        or returns the bearer token itself.'
      operationId: diag_fhir_diag_fhir_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Diag Fhir Diag Fhir Get
  /triage/census:
    post:
      summary: Triage Census
      operationId: triage_census_triage_census_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CensusRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Triage Census Triage Census Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /briefing/{patient_id}:
    post:
      summary: Briefing
      operationId: briefing_briefing__patient_id__post
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          title: Patient Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/BriefingRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /session/{session_id}/query:
    post:
      summary: Targeted Query
      operationId: targeted_query_session__session_id__query_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Targeted Query Session  Session Id  Query Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /medication/safety/{patient_id}:
    get:
      summary: Medication Safety
      description: 'Button-driven medication safety surface.


        Optional ?session_id= query param: when provided, the result is persisted

        as a synthetic conversation turn so subsequent dispatcher calls see this

        in their loaded history (allows pronoun resolution after a button click).


        Optional ?force_refresh=true query param: when true, bypasses the bundle

        cache so the safety report reflects current FHIR state and the response

        carries a fresh ``generated_at`` timestamp. Wired to the in-UI Refresh

        button on the medication-safety bubble (mirrors the briefing endpoint).'
      operationId: medication_safety_medication_safety__patient_id__get
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          title: Patient Id
      - name: session_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
      - name: force_refresh
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force Refresh
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Medication Safety Medication Safety  Patient Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /handoff/generate:
    post:
      summary: Handoff Generate
      operationId: handoff_generate_handoff_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Handoff Generate Handoff Generate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /handoff/generate/stream:
    post:
      summary: Handoff Generate Stream
      operationId: handoff_generate_stream_handoff_generate_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent/triage_rationale/{patient_id}:
    post:
      summary: Triage Rationale
      description: "Click-to-expand triage rationale \u2014 direct call, not dispatched."
      operationId: triage_rationale_agent_triage_rationale__patient_id__post
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          title: Patient Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRationaleRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Triage Rationale Agent Triage Rationale  Patient Id  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent/query:
    post:
      summary: Agent Query
      description: "Route physician queries through the LangGraph supervisor pipeline.\n\
        \nTopology: supervisor -> structured (which wraps the legacy dispatcher)\n\
        -> critic -> finalize. The graph's structured_node calls\n``agent.dispatcher.dispatch``\
        \ internally, so the response contract\n(``{narrative, data, citations, ...}``)\
        \ is preserved \u2014 we surface\n``final[\"finalized\"][\"structured_response\"\
        ]`` as the response body.\n\nPayload mapping:\n  * ``message``, ``session_id``,\
        \ ``provider_id`` map 1:1 to graph state.\n  * ``patient_ids[0]`` becomes\
        \ ``state[\"patient_id\"]`` (graph state holds\n    a single patient; the\
        \ structured_node rebuilds session_context from\n    graph state).\n  * ``provider_name``\
        \ and ``census_context`` are NOT plumbed through the\n    graph today \u2014\
        \ these were prompt-enrichment hints for the dispatcher\n    and degrade gracefully\
        \ when absent. If they prove load-bearing,\n    extend ``W2State`` and ``_build_session_context``\
        \ in a follow-up."
      operationId: agent_query_agent_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Agent Query Agent Query Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent/prefetch/status:
    get:
      summary: Agent Prefetch Status
      description: "Return per-patient warm status for the UI's \u26A1/\u23F3 pills.\n\
        \nBest-effort read from the Redis hash populated by ``_warm_one``.\nEmpty\
        \ result (no key, or Redis unavailable) means \"no warm in\nprogress for this\
        \ session\" \u2014 the UI treats every patient as\n\"warmed\" in that case\
        \ so it doesn't get stuck showing pending\npills forever."
      operationId: agent_prefetch_status_agent_prefetch_status_get
      parameters:
      - name: session_id
        in: query
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Agent Prefetch Status Agent Prefetch Status Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent/prefetch:
    post:
      summary: Agent Prefetch
      description: "Signal that the React panel has mounted and FHIR pre-fetch should\
        \ begin.\n\nV1: acknowledges immediately; the actual cache warming is handled\
        \ by the\nexisting FHIR client on the first get_census_summary tool call.\
        \  This\nendpoint exists so the UI can fire a non-blocking fetch on mount\
        \ without\nwaiting for it \u2014 keeping the session-open flow in UX_SPEC\
        \ \xA73 intact."
      operationId: agent_prefetch_agent_prefetch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrefetchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Agent Prefetch Agent Prefetch Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent/client-timing:
    post:
      summary: Client Timing
      description: Receive a browser-reported timing sample. Logs + emits a histogram
        observation.
      operationId: client_timing_agent_client_timing_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientTimingRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /session/{session_id}/message:
    post:
      summary: Post Message
      operationId: post_message_session__session_id__message_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Post Message Session  Session Id  Message Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /session/{session_id}/history:
    get:
      summary: Get History
      operationId: get_history_session__session_id__history_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get History Session  Session Id  History Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /document/ingest:
    post:
      summary: Document Ingest
      description: "Path B: inline upload of a clinical PDF (W2 \xA74.2 / \xA74.5\
        \ / \xA74.7).\n\nPipeline: size/page guard \u2192 FHIR write \u2192 idempotent\
        \ claim \u2192 extract \u2192\npersist \u2192 audit. Soft-warns are returned\
        \ inline (Slice 1.7)."
      operationId: document_ingest_document_ingest_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_document_ingest_document_ingest_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Document Ingest Document Ingest Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /evidence/search:
    post:
      summary: Evidence Search
      operationId: evidence_search_evidence_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Evidence Search Evidence Search Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent/w2/dispatch:
    post:
      summary: Agent W2 Dispatch
      description: "W2 LangGraph dispatch endpoint.\n\nAccepts a multipart upload\
        \ with any of:\n  * ``file`` \u2014 PDF for the document path.\n  * ``message``\
        \ \u2014 free-text query for the structured / retriever path.\n  * ``patient_id``\
        \ \u2014 required for demographics check on the document path.\n\nReturns\
        \ ``text/event-stream``. Currently emits a single ``event: done``\nframe carrying\
        \ the ``finalized`` envelope; per-node progress frames are\na future enhancement."
      operationId: agent_w2_dispatch_agent_w2_dispatch_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_agent_w2_dispatch_agent_w2_dispatch_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AgentQueryRequest:
      properties:
        message:
          type: string
          title: Message
        session_id:
          type: string
          title: Session Id
        provider_id:
          type: string
          title: Provider Id
        patient_ids:
          items:
            type: string
          type: array
          title: Patient Ids
          default: []
        provider_name:
          type: string
          title: Provider Name
          default: Provider
        census_context:
          anyOf:
          - type: string
          - type: 'null'
          title: Census Context
      type: object
      required:
      - message
      - session_id
      - provider_id
      title: AgentQueryRequest
    Body_agent_w2_dispatch_agent_w2_dispatch_post:
      properties:
        file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: File
        patient_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Patient Id
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        session_id:
          type: string
          title: Session Id
        provider_id:
          type: string
          title: Provider Id
        doc_type_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Doc Type Hint
      type: object
      required:
      - session_id
      - provider_id
      title: Body_agent_w2_dispatch_agent_w2_dispatch_post
    Body_document_ingest_document_ingest_post:
      properties:
        file:
          type: string
          format: binary
          title: File
        patient_id:
          type: string
          title: Patient Id
        doc_type_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Doc Type Hint
      type: object
      required:
      - file
      - patient_id
      title: Body_document_ingest_document_ingest_post
    BriefingRequest:
      properties:
        force_refresh:
          type: boolean
          title: Force Refresh
          default: false
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
      type: object
      title: BriefingRequest
    BriefingResponse:
      properties:
        patient_id:
          type: string
          title: Patient Id
        name:
          type: string
          title: Name
        openemr_pid:
          type: string
          title: Openemr Pid
          default: ''
        sections:
          items:
            $ref: '#/components/schemas/BriefingSection'
          type: array
          title: Sections
        alerts:
          items:
            type: string
          type: array
          title: Alerts
          description: 'Hard alerts that must always be shown: critical labs, stale
            values.'
        summary:
          type: string
          title: Summary
          description: 2-3 sentence executive synthesis of the patient's most important
            issues. Plain English. Not source-attributed.
          default: ''
        generated_at:
          type: string
          title: Generated At
          description: ISO-8601 UTC timestamp of generation.
      type: object
      required:
      - patient_id
      - name
      - generated_at
      title: BriefingResponse
    BriefingSection:
      properties:
        section:
          type: string
          title: Section
          description: 'Section name: diagnosis | medications | vitals | labs | allergies
            | alerts'
        summary:
          type: string
          title: Summary
          description: 1-2 sentence plain-English summary of the section.
        claims:
          items:
            $ref: '#/components/schemas/ClinicalClaim'
          type: array
          title: Claims
          description: Individual clinical claims with source attribution.
      type: object
      required:
      - section
      - summary
      - claims
      title: BriefingSection
    CensusRequest:
      properties:
        patient_ids:
          items:
            type: string
          type: array
          title: Patient Ids
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        provider_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Id
        force_refresh:
          type: boolean
          title: Force Refresh
          default: false
      type: object
      required:
      - patient_ids
      title: CensusRequest
    ClientTimingRequest:
      properties:
        action:
          type: string
          title: Action
        duration_ms:
          type: integer
          title: Duration Ms
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        t_navigation_start_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: T Navigation Start Ms
        extra:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Extra
      type: object
      required:
      - action
      - duration_ms
      title: ClientTimingRequest
    ClinicalClaim:
      properties:
        text:
          type: string
          title: Text
          description: The clinical statement in plain English.
        source_resource:
          type: string
          title: Source Resource
          description: FHIR resource type (Observation, Condition, etc.)
        source_code:
          type: string
          title: Source Code
          description: LOINC or SNOMED code of the source record.
        source_value:
          type: string
          title: Source Value
          description: Exact value from the source record.
        source_dt:
          type: string
          title: Source Dt
          description: ISO-8601 effective date/time of the source record.
      type: object
      required:
      - text
      - source_resource
      - source_code
      - source_value
      - source_dt
      title: ClinicalClaim
    DestructionRecordRequest:
      properties:
        target_session:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Session
        target_patient:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Patient
        target_window_start:
          anyOf:
          - {}
          - type: 'null'
          title: Target Window Start
        target_window_end:
          anyOf:
          - {}
          - type: 'null'
          title: Target Window End
        rows_affected:
          type: integer
          title: Rows Affected
          default: 0
        reason:
          type: string
          title: Reason
      type: object
      required:
      - reason
      title: DestructionRecordRequest
    DestructionRecordResponse:
      properties:
        destruction_id:
          type: integer
          title: Destruction Id
        ts:
          type: string
          title: Ts
      type: object
      required:
      - destruction_id
      - ts
      title: DestructionRecordResponse
    EvidenceSearchRequest:
      properties:
        query:
          type: string
          title: Query
        k:
          type: integer
          title: K
          default: 5
      type: object
      required:
      - query
      title: EvidenceSearchRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HandoffRequest:
      properties:
        patient_ids:
          items:
            type: string
          type: array
          title: Patient Ids
        shift_end_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Shift End Time
      type: object
      required:
      - patient_ids
      title: HandoffRequest
    MessageRequest:
      properties:
        role:
          type: string
          title: Role
          default: user
        content:
          type: string
          title: Content
      type: object
      required:
      - content
      title: MessageRequest
    PrefetchRequest:
      properties:
        session_id:
          type: string
          title: Session Id
        provider_id:
          type: string
          title: Provider Id
        patient_ids:
          items:
            type: string
          type: array
          title: Patient Ids
          default: []
        force_refresh:
          type: boolean
          title: Force Refresh
          default: false
      type: object
      required:
      - session_id
      - provider_id
      title: PrefetchRequest
    QueryRequest:
      properties:
        patient_id:
          type: string
          title: Patient Id
        query:
          type: string
          title: Query
      type: object
      required:
      - patient_id
      - query
      title: QueryRequest
    TriageRationaleRequest:
      properties:
        patient_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Patient Id
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        provider_id:
          type: string
          title: Provider Id
          default: system
      type: object
      title: TriageRationaleRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
